name: ci

on:
  push:
    branches:
      - noetic
  pull_request:
  workflow_dispatch:

defaults:
  run:
    shell: bash

jobs:
  cpp-quality:
    name: C++ quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run C++ static quality gate
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-format
          .xgc2/scripts/check_cpp_quality.sh

  package-compliance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check package metadata and packaging consistency
        run: |
          set -euo pipefail
          git diff --check HEAD
          .xgc2/scripts/check_package_compliance.sh

  deb-build:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
        planner_group: [common, gcopter, jps3d, cerlab-planner, intent-mpc, mader, robust-mader, ego-planner, fast-planner]
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}

    steps:
      - uses: actions/checkout@v4

      - name: Build planner deb packages in Docker
        run: |
          set -euo pipefail
          export PACKAGE_VERSION="$(sed -nE 's|^version:[[:space:]]*([^[:space:]#]+).*|\1|p' .xgc2/product.yml | head -n1)"
          .xgc2/scripts/build_debs_in_docker.sh \
            --planner-group "${{ matrix.planner_group }}" \
            --work-dir "$RUNNER_TEMP/planner-${{ matrix.planner_group }}-${{ matrix.arch }}" \
            --output-dir "$GITHUB_WORKSPACE/debs" \
            --skip-install-check

      - name: Upload deb artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xgc2-planner-${{ matrix.planner_group }}-debs-${{ matrix.arch }}
          path: debs/*.deb

  meta-build:
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4

      - name: Build planner metapackages
        run: |
          set -euo pipefail
          export PACKAGE_VERSION="$(sed -nE 's|^version:[[:space:]]*([^[:space:]#]+).*|\1|p' .xgc2/product.yml | head -n1)"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fakeroot
          mkdir -p debs
          .xgc2/scripts/package_debs.sh \
            --package-group meta \
            --output-dir "$GITHUB_WORKSPACE/debs"

      - name: Upload meta deb artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xgc2-planner-meta-debs-${{ matrix.arch }}
          path: debs/*.deb
