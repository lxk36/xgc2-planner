name: ci

on:
  push:
    branches:
      - noetic
  pull_request:
  workflow_dispatch:

defaults:
  run:
    shell: bash

jobs:
  cpp-quality:
    name: C++ quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run C++ static quality gate
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/work" -w /work \
            ghcr.io/xgc-team/xgc2-images/xgc2-build-focal-dev:1.0.0 \
            bash -lc './.xgc2/scripts/check_cpp_quality.sh'

  package-compliance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check package metadata and packaging consistency
        run: |
          set -euo pipefail
          git diff --check HEAD
          .xgc2/scripts/check_package_compliance.sh

  deb-build:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
        planner_group: [common, gcopter, jps3d, cerlab-planner, intent-mpc, mader, robust-mader, ego-planner, fast-planner]
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}

    steps:
      - uses: actions/checkout@v4

      - name: Build planner deb packages in Docker
        run: |
          set -euo pipefail
          export PACKAGE_VERSION="$(sed -nE 's|^version:[[:space:]]*([^[:space:]#]+).*|\1|p' .xgc2/product.yml | head -n1)"
          .xgc2/scripts/build_debs_in_docker.sh \
            --planner-group "${{ matrix.planner_group }}" \
            --work-dir "$RUNNER_TEMP/planner-${{ matrix.planner_group }}-${{ matrix.arch }}" \
            --output-dir "$GITHUB_WORKSPACE/debs" \
            --skip-install-check

      - name: Create trusted build manifest
        run: |
          product_version="$(sed -nE 's|^version:[[:space:]]*([^[:space:]#]+).*|\1|p' .xgc2/product.yml | head -n1)"
          python3 .xgc2/scripts/xgc2_artifact_manifest.py build \
            --deb-dir debs \
            --output-dir .ci/build-manifests \
            --product xgc2-planner \
            --product-version "$product_version" \
            --distribution focal \
            --architecture "${{ matrix.arch }}" \
            --source-sha "$GITHUB_SHA" \
            --ci-run-id "$GITHUB_RUN_ID" \
            --ci-workflow "$GITHUB_WORKFLOW" \
            --ci-workflow-ref "$GITHUB_WORKFLOW_REF"
          mv ".ci/build-manifests/xgc2-planner_focal_${{ matrix.arch }}.build.json" \
            ".ci/build-manifests/xgc2-planner_${{ matrix.planner_group }}_focal_${{ matrix.arch }}.build.json"

      - name: Upload deb artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xgc2-planner-${{ matrix.planner_group }}-debs-${{ matrix.arch }}
          path: |
            debs/*.deb
            .ci/build-manifests/*.json
          retention-days: 14
          include-hidden-files: true

  meta-build:
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container: ghcr.io/xgc-team/xgc2-images/xgc2-build-focal-dev:1.0.0

    steps:
      - uses: actions/checkout@v4

      - name: Build planner metapackages
        run: |
          set -euo pipefail
          export PACKAGE_VERSION="$(sed -nE 's|^version:[[:space:]]*([^[:space:]#]+).*|\1|p' .xgc2/product.yml | head -n1)"
          mkdir -p debs
          .xgc2/scripts/package_debs.sh \
            --package-group meta \
            --output-dir "$GITHUB_WORKSPACE/debs"

      - name: Create trusted build manifest
        run: |
          product_version="$(sed -nE 's|^version:[[:space:]]*([^[:space:]#]+).*|\1|p' .xgc2/product.yml | head -n1)"
          python3 .xgc2/scripts/xgc2_artifact_manifest.py build \
            --deb-dir debs \
            --output-dir .ci/build-manifests \
            --product xgc2-planner \
            --product-version "$product_version" \
            --distribution focal \
            --architecture "${{ matrix.arch }}" \
            --source-sha "$GITHUB_SHA" \
            --ci-run-id "$GITHUB_RUN_ID" \
            --ci-workflow "$GITHUB_WORKFLOW" \
            --ci-workflow-ref "$GITHUB_WORKFLOW_REF"
          mv ".ci/build-manifests/xgc2-planner_focal_${{ matrix.arch }}.build.json" \
            ".ci/build-manifests/xgc2-planner_meta_focal_${{ matrix.arch }}.build.json"

      - name: Upload meta deb artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xgc2-planner-meta-debs-${{ matrix.arch }}
          path: |
            debs/*.deb
            .ci/build-manifests/*.json
          retention-days: 14
          include-hidden-files: true
