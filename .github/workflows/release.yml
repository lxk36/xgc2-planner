name: release

on:
  workflow_dispatch:
    inputs:
      expected_version:
        description: Expected .xgc2/product.yml version
        required: true
        type: string
      expected_source_sha:
        description: Expected source commit SHA
        required: true
        type: string
      prepare_action:
        description: Release-train action
        required: false
        default: release
        type: choice
        options:
          - release
          - compatibility-verify
      apt_overlay_url:
        description: Optional release-scoped staging APT base URL
        required: false
        default: ""
        type: string
      dependency_set_digest:
        description: SHA256 of the resolved release-train dependency set
        required: false
        default: ""
        type: string
      run_cpp_quality:
        description: Run C++ quality checks
        required: true
        default: false
        type: boolean
      run_source_tests:
        description: Run source tests
        required: true
        default: false
        type: boolean

permissions:
  actions: read
  contents: read

defaults:
  run:
    shell: bash

env:
  XGC2_APT_OVERLAY_URL: ${{ inputs.apt_overlay_url }}
  XGC2_DEPENDENCY_SET_DIGEST: ${{ inputs.dependency_set_digest }}

jobs:
  prepare-contract:
    name: Validate prepare contract
    runs-on: ubuntu-latest
    steps:
      - name: Validate release-train inputs
        env:
          PREPARE_ACTION: ${{ inputs.prepare_action }}
          APT_OVERLAY_URL: ${{ inputs.apt_overlay_url }}
          DEPENDENCY_SET_DIGEST: ${{ inputs.dependency_set_digest }}
        run: |
          set -euo pipefail
          case "$PREPARE_ACTION" in
            release|compatibility-verify) ;;
            *)
              echo "unsupported prepare_action: $PREPARE_ACTION" >&2
              exit 1
              ;;
          esac
          if [[ -n "$DEPENDENCY_SET_DIGEST" && ! "$DEPENDENCY_SET_DIGEST" =~ ^[0-9a-f]{64}$ ]]; then
            echo "dependency_set_digest must be empty or 64 lowercase hex characters" >&2
            exit 1
          fi
          if [[ -n "$APT_OVERLAY_URL" && ! "$DEPENDENCY_SET_DIGEST" =~ ^[0-9a-f]{64}$ ]]; then
            echo "apt_overlay_url requires a dependency_set_digest" >&2
            exit 1
          fi

  validate-release-inputs:
    needs: prepare-contract
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.product.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate expected version and source SHA
        id: product
        run: |
          set -euo pipefail
          version="$(sed -nE 's|^version:[[:space:]]*([^[:space:]#]+).*|\1|p' .xgc2/product.yml | head -n1)"
          if [[ -z "${version}" ]]; then
            echo "::error::missing version in .xgc2/product.yml"
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          if [[ "${version}" != "${{ inputs.expected_version }}" ]]; then
            echo "::error::product.yml version ${version} does not match expected_version ${{ inputs.expected_version }}"
            exit 1
          fi
          source_sha="$(git rev-parse HEAD)"
          if [[ "${source_sha}" != "${{ inputs.expected_source_sha }}" ]]; then
            echo "::error::HEAD ${source_sha} does not match expected_source_sha ${{ inputs.expected_source_sha }}"
            exit 1
          fi

  package-compliance:
    needs: validate-release-inputs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check package metadata and packaging consistency
        run: |
          set -euo pipefail
          git diff --check HEAD
          .xgc2/scripts/check_package_compliance.sh

  cpp-quality:
    if: ${{ inputs.run_cpp_quality }}
    needs: validate-release-inputs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run C++ static quality gate
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-format
          .xgc2/scripts/check_cpp_quality.sh

  source-tests:
    if: ${{ inputs.run_source_tests }}
    needs: validate-release-inputs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Build and run ROS package checks
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/package-tests"
          docker run --rm \
            -e XGC2_APT_OVERLAY_URL="${XGC2_APT_OVERLAY_URL:-}" \
            -e DEBIAN_FRONTEND=noninteractive \
            -e ROS_PACKAGE_CHECK_WORK_DIR=/workspace/work \
            -v "$GITHUB_WORKSPACE:/workspace/repo:ro" \
            -v "$RUNNER_TEMP/package-tests:/workspace/work" \
            ros:noetic-ros-base-focal \
            bash -lc '
              set -euo pipefail
              apt-get update
              apt-get install -y --no-install-recommends \
                build-essential \
                cmake \
                libboost-dev \
                libeigen3-dev \
                libompl-dev \
                libyaml-cpp-dev \
                rsync \
                ros-noetic-geometry-msgs \
                ros-noetic-message-generation \
                ros-noetic-nav-msgs \
                ros-noetic-roscpp \
                ros-noetic-rospack \
                ros-noetic-sensor-msgs \
                ros-noetic-std-msgs \
                ros-noetic-visualization-msgs
              /workspace/repo/.xgc2/scripts/check_ros_packages.sh --work-dir /workspace/work
            '

  deb-build:
    needs: validate-release-inputs
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
        planner_group: [common, gcopter, jps3d, cerlab-planner, intent-mpc, mader, robust-mader, ego-planner, fast-planner]
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    env:
      PACKAGE_VERSION: ${{ needs.validate-release-inputs.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Build planner deb packages in Docker
        run: |
          install -d .ci/build-manifests
          .xgc2/scripts/build_debs_in_docker.sh \
            --planner-group "${{ matrix.planner_group }}" \
            --work-dir "$RUNNER_TEMP/planner-${{ matrix.planner_group }}-${{ matrix.arch }}" \
            --output-dir "$GITHUB_WORKSPACE/debs" \
            --skip-install-check

      - name: Create release-train build manifest
        run: |
          python3 .xgc2/scripts/xgc2_artifact_manifest.py build \
            --deb-dir debs \
            --output-dir .ci/build-manifests \
            --product xgc2-planner \
            --product-version "${{ inputs.expected_version }}" \
            --distribution focal \
            --architecture "${{ matrix.arch }}" \
            --source-sha "${{ inputs.expected_source_sha }}" \
            --ci-run-id "$GITHUB_RUN_ID" \
            --ci-workflow "$GITHUB_WORKFLOW" \
            --ci-workflow-ref "$GITHUB_WORKFLOW_REF"
          mv ".ci/build-manifests/xgc2-planner_focal_${{ matrix.arch }}.build.json" \
            ".ci/build-manifests/xgc2-planner_${{ matrix.planner_group }}_focal_${{ matrix.arch }}.build.json"

      - name: Upload deb artifacts
        if: ${{ inputs.prepare_action == 'release' }}
        uses: actions/upload-artifact@v4
        with:
          name: xgc2-planner-${{ matrix.planner_group }}-release-debs-${{ matrix.arch }}
          path: |
            debs/*.deb
            .ci/build-manifests/*.json
          retention-days: 14
          include-hidden-files: true

  meta-build:
    needs: validate-release-inputs
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      PACKAGE_VERSION: ${{ needs.validate-release-inputs.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Build planner metapackages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fakeroot
          mkdir -p debs
          .xgc2/scripts/package_debs.sh \
            --package-group meta \
            --output-dir "$GITHUB_WORKSPACE/debs"

      - name: Create release-train build manifest
        run: |
          python3 .xgc2/scripts/xgc2_artifact_manifest.py build \
            --deb-dir debs \
            --output-dir .ci/build-manifests \
            --product xgc2-planner \
            --product-version "${{ inputs.expected_version }}" \
            --distribution focal \
            --architecture "${{ matrix.arch }}" \
            --source-sha "${{ inputs.expected_source_sha }}" \
            --ci-run-id "$GITHUB_RUN_ID" \
            --ci-workflow "$GITHUB_WORKFLOW" \
            --ci-workflow-ref "$GITHUB_WORKFLOW_REF"
          mv ".ci/build-manifests/xgc2-planner_focal_${{ matrix.arch }}.build.json" \
            ".ci/build-manifests/xgc2-planner_meta_focal_${{ matrix.arch }}.build.json"

      - name: Upload meta deb artifacts
        if: ${{ inputs.prepare_action == 'release' }}
        uses: actions/upload-artifact@v4
        with:
          name: xgc2-planner-meta-release-debs-${{ matrix.arch }}
          path: |
            debs/*.deb
            .ci/build-manifests/*.json
          retention-days: 14
          include-hidden-files: true
